<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f9fafb;
      color: #111827;
    }
    .container { padding: 20px; }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .logo-text { font-size: 16px; font-weight: 600; }
    .status {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .status.logged-in { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .status.logged-out { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
    .status.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary {
      background: #fff;
      color: #374151;
      border: 1px solid #d1d5db;
      margin-top: 8px;
    }
    .btn-secondary:hover { background: #f3f4f6; }
    .btn-danger {
      background: #fff;
      color: #dc2626;
      border: 1px solid #fca5a5;
      margin-top: 8px;
      font-size: 11px;
    }
    .btn-danger:hover { background: #fef2f2; }
    .input-group { margin-bottom: 12px; }
    .input-group label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #6b7280;
      margin-bottom: 4px;
    }
    .input-group input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    .input-group input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }
    .divider { height: 1px; background: #e5e7eb; margin: 14px 0; }
    .hint { font-size: 10px; color: #9ca3af; text-align: center; margin-top: 12px; }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon"><img src="icons/icon48.png" alt="JobSort" /></div>
      <span class="logo-text">JobSort</span>
    </div>

    <!-- Logged out view -->
    <div id="logged-out-view">
      <div class="status logged-out">
        Sign in to save jobs with one click.
      </div>

      <button class="btn btn-primary" id="signin-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Sign in with Google
      </button>

      <div class="divider"></div>
      <div class="input-group">
        <label>Google Client ID</label>
        <input type="text" id="google-client-id" placeholder="YOUR_CLIENT_ID.apps.googleusercontent.com">
      </div>
      <div class="input-group">
        <label>API Server URL</label>
        <input type="text" id="api-url-out" placeholder="http://localhost:8000">
      </div>
      <button class="btn btn-secondary" id="save-settings-out">Save Settings</button>
      <p class="hint" id="login-error" style="display:none;color:#dc2626;"></p>
    </div>

    <!-- Logged in view -->
    <div id="logged-in-view" style="display:none">
      <div class="status logged-in" id="user-status">✓ Connected</div>
      <div class="input-group">
        <label>API Server URL</label>
        <input type="text" id="api-url" placeholder="http://localhost:8000">
      </div>
      <button class="btn btn-secondary" id="save-settings">Save Settings</button>
      <div class="divider"></div>
      <button class="btn btn-primary" id="open-dashboard">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Open JobSort Dashboard
      </button>
      <button class="btn btn-danger" id="logout-btn">Sign Out</button>
      <p class="hint">Browse LinkedIn, Indeed, Glassdoor, Monster, ZipRecruiter, Dice, SimplyHired, Wellfound, or CareerBuilder — a button will appear on job pages.</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
